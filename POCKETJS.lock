#   large-image seam PicoView consumed through PR #49..#55. Superseded by the
#   owned-admission revision above; see
#   docs/PICOVIEW-DIRECT-IMAGE-ADMISSION-MIGRATION-1-EVIDENCE.md.

# Policy
# - PicoView consumes PocketJS at exactly this revision.
# - No git submodule, no vendoring, no copying PocketJS source into PicoView.
# - Runtime-generic capability work is implemented in jnhu76/pocketjs first,
#   reviewed/merged there, and only then is this lock advanced deliberately.
# - Future upstream synchronization flows through sync/* children of
#   integration/picoview-desktop, never reverse into any main.
# - Historical campaign baselines (e.g. pocket-stack/pocketjs a5a8535…,
