# What this revision provides
#
# - Windows Desktop parity in the shared hosts/desktop + pocket-ui-wgpu family;
# - owned RGBA8 logical-resource admission (Ui::upload_owned_rgba8): a host
#   decoder's Vec moves into the existing PocketJS texture record — one
#   logical handle namespace, unchanged generation/revision/free semantics;
# - a direct pocket-ui-wgpu upload path that borrows those RGBA8 bytes for
#   Queue::write_texture with no intermediate canonical CPU plane;
# - R1 desktop presentation geometry (live viewport bounds, exact/transient
#   blit, RenderSignature) on the reviewed integration tip;
# - `pocket-desktop-host` library export of generic R1 presentation geometry
#   (PresentationGeometry / ViewportPolicy / RenderSignature / resolve_geometry)
#   so PicoView consumes the shared rules instead of a local duplicate;
# - R2 generic minification quality: pocket-ui-wgpu linear image textures
#   create a GPU mip chain (level count floor(log2(max(w,h)))+1), upload
#   level 0 once, generate deeper levels on device; linear sampler uses
#   Linear min/mag/mip filtering. No CPU pyramid.
# - Desktop image capability: pocket3d `desktop_image_required_limits` raises
#   only `max_texture_dimension_2d` to adapter.limits() at device creation;
#   hosts export created-device truth via `Ui::set_image_max_texture_dim`;
#   `upload_owned_rgba8` admits up to that installed ceiling
#   (portable default remains `NATIVE_TEX_MAX_DIM` 8192).

# Consumption rules
#
# - PicoView Cargo dependencies resolve PocketJS crates as path dependencies
#   into `third_party/pocketjs`. No PocketJS git dependency, no submodule.
# - A plain `git clone` of PicoView contains this PocketJS snapshot; no
#   submodule init and no jnhu76/pocketjs fetch is required to build.
# - Do not manually copy files between the PicoView and PocketJS repositories.
# - PocketJS runtime-generic capability work is still implemented and reviewed
#   in jnhu76/pocketjs first, then frozen on integration/picoview-desktop.
#   Neither jnhu76/pocketjs main nor pocket-stack/pocketjs main is an
#   integration target for PicoView-specific dependency advancement.
# - Historical campaign baselines remain research/history only and must never
#   replace this subtree snapshot without a deliberate sync.

# How to update this subtree
#
# Fresh clones do not ship a `pocketjs` remote. Bootstrap it before any
# fetch/subtree pull. Human-facing contract: docs/integration/POCKETJS.md
#
# 0. Bootstrap / verify the pocketjs remote (do not skip on a fresh clone):
#      git remote get-url pocketjs
#    - if the remote is missing:
#        git remote add pocketjs git@github.com:jnhu76/pocketjs.git
#    - if the remote exists but the URL is not git@github.com:jnhu76/pocketjs.git
#      (or the equivalent https://github.com/jnhu76/pocketjs.git):
#        STOP — do not re-point a different remote silently; fix identity first.
# 1. Fetch the integration branch:
#      git fetch pocketjs integration/picoview-desktop
# 2. Verify the reviewed integration SHA:
#      git rev-parse pocketjs/integration/picoview-desktop
#    Confirm it matches the reviewed PocketJS campaign tip (human review).
# 3. Update the subtree:
#      git subtree pull --prefix=third_party/pocketjs pocketjs integration/picoview-desktop --squash
# 4. Advance `revision` in this file to that exact SHA.
# 5. Rebuild/test PicoView and, when relevant, PocketJS tests under
#    third_party/pocketjs. Open a focused PicoView PR.

