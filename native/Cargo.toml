[package]
name = "picoview"
version = "0.1.0"
edition = "2024"
# Build floor actually required by this crate and its locked dependencies:
# the language floor is Rust 1.88 (edition 2024 + let-chains in production
# code, app.rs try_send_input), but Cargo.lock pins cosmic-text 0.19.0 and
# smol_str 0.3.6, which declare rustc 1.89 — verified empirically:
# `cargo +1.88.0 check` fails at resolution, `cargo +1.89.0 check` resolves.
rust-version = "1.89"
license = "MIT"
description = "PicoView native host: Current Item authority, WIC baseline decode, PocketJS presentation"

[[bin]]
name = "picoview"
path = "src/main.rs"

[build-dependencies]
# Windows EXE resources: app icon (assets/branding/picoview-app.ico) + VERSIONINFO.
winresource = "0.1"
# Product manifest authority (guest/pocket.json): version mirror gate +
# build-time derivation of product geometry facts (build.rs).
serde_json = "1"

# PocketJS is consumed from the in-tree git-subtree snapshot at
# third_party/pocketjs (see POCKETJS.lock). Path dependencies only — no
# PocketJS git/submodule sources. Future sync uses git subtree pull, not
# manual copying.
[dependencies]
pocketjs-core = { path = "../third_party/pocketjs/engine/core", features = ["std"] }
pocket-mod = { path = "../third_party/pocketjs/engine/crates/pocket-mod" }
pocket-ui-surface = { path = "../third_party/pocketjs/engine/crates/pocket-ui-surface" }
pocket-text = { path = "../third_party/pocketjs/engine/crates/pocket-text" }
pocket-ui-wgpu = { path = "../third_party/pocketjs/engine/crates/pocket-ui-wgpu" }
pocket3d = { path = "../third_party/pocketjs/engine/pocket3d/crates/pocket3d", default-features = false }
# Shared R1 presentation geometry (PocketJS hosts/desktop library export).
pocket-desktop-host = { path = "../third_party/pocketjs/hosts/desktop" }
wgpu = "25"
winit = "0.30"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Registry",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }
rfd = "0.15"

# Enforce the local SAFETY proof obligation at every unsafe site (private
# items included). missing_safety_doc is deliberately NOT enabled: it only
# covers public unsafe fn, and this crate has none — it would be a gate
# that fires nowhere.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
