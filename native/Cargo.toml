[package]
name = "picoview"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "PicoView native host: Current Item authority, WIC baseline decode, PocketJS presentation"

[[bin]]
name = "picoview"
path = "src/main.rs"

# PocketJS is consumed at the exact revision pinned by PicoView's POCKETJS.lock
# (jnhu76/pocketjs:integration/picoview-desktop). No submodule, no vendoring,
# no path/`..` dependency. Every PocketJS git dependency below must stay on
# that same exact revision.
[dependencies]
pocketjs-core = { git = "https://github.com/jnhu76/pocketjs.git", rev = "24bab5e8df7d0bb7003ad55c8637e4ee9351f3cb", features = ["std"] }
pocket-mod = { git = "https://github.com/jnhu76/pocketjs.git", rev = "24bab5e8df7d0bb7003ad55c8637e4ee9351f3cb" }
pocket-ui-surface = { git = "https://github.com/jnhu76/pocketjs.git", rev = "24bab5e8df7d0bb7003ad55c8637e4ee9351f3cb" }
pocket-text = { git = "https://github.com/jnhu76/pocketjs.git", rev = "24bab5e8df7d0bb7003ad55c8637e4ee9351f3cb" }
pocket-ui-wgpu = { git = "https://github.com/jnhu76/pocketjs.git", rev = "24bab5e8df7d0bb7003ad55c8637e4ee9351f3cb" }
pocket3d = { git = "https://github.com/jnhu76/pocketjs.git", rev = "24bab5e8df7d0bb7003ad55c8637e4ee9351f3cb", default-features = false }
wgpu = "25"
winit = "0.30"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Registry",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Variant",
] }
rfd = "0.15"
